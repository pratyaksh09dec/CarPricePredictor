<!DOCTYPE html>
<html>

<head>

    <title>Car Price Predictor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <script>

        const companyModels =
        {{ company_model_dict|tojson }};

        const selectedModel = "{{ selected_model if selected_model else '' }}";

        function updateModels() {

            let company =
                document.getElementById("company").value;

            let modelDropdown =
                document.getElementById("model");

            modelDropdown.innerHTML = "";

            let models =
                companyModels[company];

            models.forEach(function(model){

                let option = document.createElement("option");

                option.value = model;
                option.text = model;

                if(model === selectedModel){
                option.selected = true;
                }

                modelDropdown.appendChild(option);
            });
        }

        window.onload = function() {
            updateModels();
        };

    </script>

</head>

<body>

<div class="container">

    <h1>Welcome to Car Price Predictor</h1>

    <form action="/predict" method="POST">

        <label>Select Company:</label>

        <select id="company"
                name="company"
                onchange="updateModels()">

            {% for company in companies %}
            <option value="{{ company }}"
            {% if company == selected_company %}selected{% endif %}>
                {{ company }}
            </option>
            {% endfor %}

        </select>

        <label>Select Model:</label>

        <select id="model"
                name="model">
        </select>

        <label>Select Year of Purchase:</label>

        <select name="year">

            {% for year in years %}
            <option value="{{ year }}"
            {% if year == selected_year %}selected{% endif %}>
                {{ year }}
            </option>
            {% endfor %}

        </select>

        <label>Select Fuel Type:</label>

        <select name="fuel_type">

            {% for fuel in fuel_types %}
            <option value="{{ fuel }}"
            {% if fuel == selected_fuel %}selected{% endif %}>
                {{ fuel }}
            </option>
            {% endfor %}

        </select>

        <label>Select Kilometers Travelled:</label>

        <select name="kms_driven">

            <option value="100" {% if selected_kms == 100 %}selected{% endif %}>100</option>
            <option value="500" {% if selected_kms == 500 %}selected{% endif %}>500</option>
            <option value="1000" {% if selected_kms == 1000 %}selected{% endif %}>1000</option>
            <option value="5000" {% if selected_kms == 5000 %}selected{% endif %}>5000</option>
            <option value="10000" {% if selected_kms == 10000 %}selected{% endif %}>10000</option>
            <option value="15000" {% if selected_kms == 15000 %}selected{% endif %}>15000</option>
            <option value="20000" {% if selected_kms == 20000 %}selected{% endif %}>20000</option>
            <option value="30000" {% if selected_kms == 30000 %}selected{% endif %}>30000</option>
            <option value="40000" {% if selected_kms == 40000 %}selected{% endif %}>40000</option>
            <option value="50000" {% if selected_kms == 50000 %}selected{% endif %}>50000</option>
            <option value="60000" {% if selected_kms == 60000 %}selected{% endif %}>60000</option>
            <option value="70000" {% if selected_kms == 70000 %}selected{% endif %}>70000</option>
            <option value="80000" {% if selected_kms == 80000 %}selected{% endif %}>80000</option>
            <option value="90000" {% if selected_kms == 90000 %}selected{% endif %}>90000</option>
            <option value="100000" {% if selected_kms == 100000 %}selected{% endif %}>100000</option>

</select>

        </select>

        <button type="submit">
            Predict Price
        </button>

    </form>

    {% if prediction %}

    <div class="result">

        Predicted Price

        <br><br>

        {{ prediction }}

    </div>

    {% endif %}

</div>

</body>
</html>
